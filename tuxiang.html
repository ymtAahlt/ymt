<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图像解决方案 - 底部导航</title>
    <link rel="stylesheet" href="./cdn/fontawesome/css/all.min.css">
    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --line: #e9edf3;
            --text: #2d3748;
            --muted: #718096;
            --primary: #f97316;
            --primary-soft: rgba(249, 115, 22, 0.12);
            --shadow: 0 14px 30px rgba(15, 23, 42, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            padding: 24px 16px 96px;
        }

        .page {
            max-width: 720px;
            margin: 0 auto;
        }

        .demo-block {
            background: var(--card);
            border-radius: 18px;
            box-shadow: var(--shadow);
            padding: 20px 16px 14px;
            margin-bottom: 28px;
        }

        .demo-title {
            margin: 0 0 16px;
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text);
        }

        .content-card {
            background: linear-gradient(135deg, #fff7ed, #fff);
            border: 1px solid #ffedd5;
            border-radius: 14px;
            padding: 18px;
            color: var(--muted);
            line-height: 1.8;
        }

        .font-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 20;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: center;
            height: 72px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--line);
            box-shadow: 0 -6px 20px rgba(15, 23, 42, 0.06);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-decoration: none;
            color: var(--muted);
            transition: all 0.2s ease;
            font-size: 0.72rem;
        }

        .nav-item i {
            font-size: 1.35rem;
            margin-bottom: 4px;
            transition: transform 0.2s ease;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-item.active i {
            transform: translateY(-1px) scale(1.06);
        }

        .nav-item:hover {
            color: var(--primary);
        }

        .svg-nav {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: center;
            height: 72px;
            background: var(--card);
            border-top: 1px solid var(--line);
            border-radius: 18px 18px 0 0;
            box-shadow: 0 -8px 18px rgba(15, 23, 42, 0.06);
        }

        .svg-nav .nav-item {
            color: var(--muted);
        }

        .svg-nav .nav-item.active {
            color: var(--primary);
        }

        .svg-icon {
            width: 1.5rem;
            height: 1.5rem;
            margin-bottom: 4px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform 0.2s ease;
        }

        .svg-nav .nav-item.active .svg-icon {
            transform: translateY(-1px) scale(1.06);
        }

        @media (max-width: 420px) {
            body {
                padding-left: 12px;
                padding-right: 12px;
            }

            .demo-block {
                padding: 14px 12px 12px;
            }

            .demo-title {
                font-size: 0.98rem;
            }

            .font-nav,
            .svg-nav {
                height: 68px;
            }

            .nav-item {
                font-size: 0.68rem;
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <section class="demo-block">
            <h3 class="demo-title">1. 字体图标底部导航（Font Awesome）</h3>
            <div class="content-card">
                这里使用字体图标方案，图标直接由 CSS 字体文件提供，层级清晰、代码简洁，适合快速实现移动端/桌面端底部导航。
            </div>
        </section>

        <section class="demo-block">
            <h3 class="demo-title">2. SVG 图标底部导航</h3>
            <div class="content-card">
                这里采用 SVG 方案，图标采用矢量路径绘制，放大不失真，且可按需调整颜色与样式，适合实现更细致的视觉设计。
            </div>
        </section>
    </div>

    <nav class="font-nav" aria-label="底部导航-字体图标">
        <a href="#" class="nav-item active" aria-label="首页">
            <i class="fa-solid fa-house"></i>
            <span>首页</span>
        </a>
        <a href="#" class="nav-item" aria-label="分类">
            <i class="fa-solid fa-bars-staggered"></i>
            <span>分类</span>
        </a>
        <a href="#" class="nav-item" aria-label="购物车">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>购物车</span>
        </a>
        <a href="#" class="nav-item" aria-label="我的">
            <i class="fa-solid fa-user"></i>
            <span>我的</span>
        </a>
    </nav>

    <div class="page" style="padding-top: 12px;">
        <section class="demo-block">
            <h3 class="demo-title">SVG 导航预览</h3>
            <nav class="svg-nav" aria-label="底部导航-SVG">
                <a href="#" class="nav-item active" aria-label="首页">
                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 10.5L12 3l9 7.5"></path>
                        <path d="M5 9.5V20h14V9.5"></path>
                    </svg>
                    <span>首页</span>
                </a>
                <a href="#" class="nav-item" aria-label="分类">
                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6h16"></path>
                        <path d="M4 12h16"></path>
                        <path d="M4 18h16"></path>
                    </svg>
                    <span>分类</span>
                </a>
                <a href="#" class="nav-item" aria-label="购物车">
                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="9" cy="18" r="1.6"></circle>
                        <circle cx="17" cy="18" r="1.6"></circle>
                        <path d="M3 4h2l2.2 9.5a1 1 0 0 0 1 .8h8.9a1 1 0 0 0 1-.8L20 7H7"></path>
                    </svg>
                    <span>购物车</span>
                </a>
                <a href="#" class="nav-item" aria-label="我的">
                    <svg class="svg-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M4 20c1.7-3.5 5-5 8-5s6.3 1.5 8 5"></path>
                    </svg>
                    <span>我的</span>
                </a>
            </nav>
        </section>
    </div>
</body>
</html>
