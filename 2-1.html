<html lang="en">

    <title>313姚明涛</title>

<body>
        <h2>HTML元素：开始标签+内容+结束标签</h2>
    <h3>内容与样式分离-语义性</h3>
        <h4>山居秋暝</h4>
        空山新雨后，<br>
        天<br>
        <p>明</p>
        <p>清</p>
        <h4>93阅兵展示的武器列表</h4>
        <ul>
            <li>东风</li>
            <li>鹰击</li>
            <li>长缨</li>
            <li>巨浪</li>
            <li>霹雳</li>
        </ul>
        <!--区域，块-->
        <!--注释：ctrl+/-->
        <div style ="background-color:#cd125a;width:400px;height:200px;">
            盒子
            <div>
                <span style="color:aliceblue;font-size:100px">姚</span>
                <span style="color:black;font-size:100px">明</span>
                <span style="color:aqua;font-size:100px">涛</span>
                <!--扩展:名字的每个字不同颜色在同一行-->
            </div>
            </div>
</body>
