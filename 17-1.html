<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>17-1 JSON展示</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --panel: #ffffff;
            --primary: #0b5fff;
            --primary-dark: #00359e;
            --accent: #dfeaff;
            --text: #22304a;
            --muted: #64748b;
            --border: #dfe7f5;
            --shadow: 0 14px 36px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background: linear-gradient(135deg, #eef5ff 0%, #f9fbff 100%);
            color: var(--text);
        }

        .container {
            width: min(1000px, calc(100% - 32px));
            margin: 40px auto;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 18px;
            padding: 28px 30px;
            box-shadow: var(--shadow);
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: clamp(1.8rem, 3vw, 2.6rem);
        }

        .header p {
            margin: 0;
            line-height: 1.8;
            opacity: 0.95;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            margin-top: 24px;
            padding: 22px 24px;
            box-shadow: var(--shadow);
        }

        .card h2 {
            margin: 0 0 16px;
            font-size: 1.3rem;
            color: var(--primary-dark);
        }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
        }

        .meta span {
            padding: 8px 12px;
            border-radius: 999px;
            background: var(--accent);
            color: var(--primary-dark);
            font-size: 0.9rem;
            font-weight: 600;
        }

        pre {
            margin: 0;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 14px;
            padding: 20px;
            overflow-x: auto;
            line-height: 1.7;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
            box-shadow: inset 0 0 0 1px rgba(148,163,184,0.15);
        }

        .footer {
            margin-top: 18px;
            color: var(--muted);
            font-size: 0.92rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>JSON 数据展示</h1>
            <p>本页面演示如何将 JavaScript 对象转换为 JSON，并在页面中优雅展示出来。</p>
        </header>

        <section class="card">
            <h2>学生信息 JSON</h2>
            <div class="meta">
                <span>学号：313</span>
                <span>姓名：姚明涛</span>
                <span>班级：计算机24003</span>
            </div>
            <pre id="jsonOutput"></pre>
        </section>

        <div class="footer">演示说明：JSON 是一种轻量级的数据交换格式，常用于前后端数据传输。</div>
    </div>

    <script>
        const studentData = {
            student: {
                id: 313,
                name: "姚明涛",
                className: "计算机24003",
                major: "计算机应用技术",
                hobbies: ["编程", "看电影", "听音乐", "运动"],
                contact: {
                    email: "313@example.com",
                    phone: "13800000000"
                }
            },
            course: {
                name: "高级网页设计",
                teacher: "袁老师",
                credits: 3,
                schedule: "每周二、四"
            },
            skills: ["HTML", "CSS", "JavaScript", "JSON", "响应式布局"],
            status: "学习中"
        };

        document.getElementById('jsonOutput').textContent = JSON.stringify(studentData, null, 2);
    </script>
</body>
</html>
