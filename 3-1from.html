<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>313 姚明涛</title>
</head>
<body>
    <h2>表单form</h2>
     <form action="http://huanqiu.com"name="y1">
        <p>用户名:<input type="text"name="username"placerholder="请输入用户名"></p>
        <p>密码：<input type="password"name="password"placerholder="请输入密码"></p>
        <!--性别:男，女，保密-->
        <p>性别:
            <input type="radio"name="sex"value="male"cheecked>男
            <input type="radio"name="sex"value="female">女
            <input type="radio"name="sex"value="secret">保密
            </p>
             <p>爱好：
    <input type="checkbox" name="hobby" value="basketball">篮球
    <input type="checkbox" name="hobby" value="football">足球
    <input type="checkbox" name="hobby" value="badminton">羽毛球
    <input type="checkbox" name="hobby" value="table_tennis">乒乓球
    </p>
    <p>籍贯:
        <select name="birthpalce">
            <option value="beijing">北京</option>
            <option value="shanghai">上海</option>
            <option value="guangzhou">广州</option>
            <option value="shenzhen">深圳</option>
        </select>
    </p>
    <p>个人介绍:<textarea name="introduction"cols="30"rows="10"placerholder="请输入个人介绍"></textarea></p>
    <p>出生日期:<input type="date"name="birthdate"></p>
    <p>上传文件:<input type="file"name="files"multiple></p>
    <!--按钮：普通，提交，重置-->
    <p>
    <input type="button"value="普通按钮">
    <input type="submit"value="提交按钮">
    <input type="reset"value="重置按钮">

     </form>
     <!--表单外的按钮button-->
     <button>按钮</button>


</body>
</html>
