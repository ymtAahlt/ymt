<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Flex布局演示</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{padding:30px;display:flex;gap:20px;}
.wrap{width:180px;height:180px;border:1px solid #333;padding:10px;}
.item{background:#ccc;height:60px;width:60px;border:1px solid #666;}

/* 图1 单个居中 */
.box1{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* 图2 垂直两个 */
.box2{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}

/* 图3 2行2列 */
.box3{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}
.row{display:flex;gap:8px;}

/* 图4 上1下2 */
.box4{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:8px;
}
</style>
</head>
<body>
    <h2>姚明涛的flex</h2>
  <div class="wrap box1"><div class="item"></div></div>

  <div class="wrap box2">
    <div class="item"></div>
    <div class="item"></div>
  </div>

  <div class="wrap box3">
    <div class="row">
      <div class="item"></div>
      <div class="item"></div>
    </div>
    <div class="row">
      <div class="item"></div>
      <div class="item"></div>
    </div>
  </div>

  <div class="wrap box4">
    <div class="item"></div>
    <div class="row">
      <div class="item"></div>
      <div class="item"></div>
    </div>
  </div>
</body>
</html>
